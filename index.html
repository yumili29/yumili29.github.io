<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四季与你</title>
  <style>
    /* 页面背景：接近白玫瑰的奶油色，非常柔和 */
    body {
      font-family: 'Songti SC', 'STSong', 'SimSun', serif; /* 使用宋体，增加文艺、高级感 */
      background-color: #f7f6f2; 
      margin: 0;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    /* 卡片样式：极简留白 */
    .card {
      background-color: #ffffff;
      padding: 40px 30px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); /* 极淡的阴影，让卡片浮起来 */
      border-radius: 4px; /* 方正的圆角，显得克制、干净 */
    }

    /* 照片样式：自然融入 */
    .photo-frame {
      width: 100%;
      margin-bottom: 35px;
    }

    .photo-frame img {
      width: 100%;
      display: block;
      border-radius: 2px;
    }

    /* 标题排版 */
    h1 {
      color: #2c3e50;
      font-size: 22px;
      font-weight: normal;
      letter-spacing: 2px; /* 字间距拉开，显得呼吸感 */
      margin-bottom: 25px;
    }

    /* 文案排版 */
    .text-content {
      color: #555;
      line-height: 2; /* 行距拉开 */
      font-size: 15px;
      letter-spacing: 1px;
    }
    
    /* 点缀的小绿叶 */
    .leaf {
      display: block;
      margin-top: 25px;
      font-size: 16px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 这里插入你的照片，文件名已经改对了 -->
    <div class="photo-frame">
      <img src="1.jpg" alt="他第一次送我的白玫瑰">
    </div>

    <h1>四季与你</h1>
    
    <div class="text-content">
      世界这么大，遇见你真好。<br>
      希望以后的每一个纪念日，<br>
      都能有花，有我们。
    </div>

    <span class="leaf">🌿</span>
    
  </div>

</body>
</html>
