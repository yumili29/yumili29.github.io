<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seasons with You</title>
  <style>
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: linear-gradient(135deg, #fdfbf7 0%, #e8ede9 100%);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      display: flex;
      flex-direction: row; 
      align-items: center;
      justify-content: center;
      gap: 40px; 
      max-width: 900px;
      width: 100%;
      animation: fadeIn 1.2s ease-out;
    }

    .image-section {
      flex: 1; 
      max-width: 450px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
      transition: transform 0.5s ease;
    }

    .image-section:hover {
      transform: translateY(-5px); 
    }

    .image-section img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .text-section {
      flex: 1;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.65); 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px);
      padding: 45px 35px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
    }

    .subtitle {
      font-size: 12px;
      color: #8a9a8f;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-family: 'Arial', sans-serif;
    }

    h1 {
      font-size: 28px;
      color: #2c3e50;
      font-weight: normal;
      letter-spacing: 3px;
      margin: 0 0 25px 0;
      line-height: 1.4;
    }

    .divider {
      width: 40px;
      height: 2px;
      background-color: #aebfb3;
      margin-bottom: 25px;
    }

    .content {
      font-size: 16px;
      color: #555;
      line-height: 2.2;
      letter-spacing: 1px;
      font-style: italic; 
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #9aa5a0;
      font-family: 'Arial', sans-serif;
      letter-spacing: 2px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        gap: 20px;
      }
      .text-section {
        padding: 30px 25px;
        text-align: center;
      }
      .divider {
        margin: 0 auto 25px auto;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="image-section">
      <!-- 这里改成了和你文件名一模一样的 1.jpg.jpg -->
      <img src="1.jpg.jpg" alt="First Flowers">
    </div>

    <div class="text-section">
      <div class="subtitle">Our Story</div>
      <h1>Seasons with You</h1>
      <div class="divider"></div>
      <div class="content">
        Out of all the world,<br>
        you met me, and I met you.<br><br>
        These are the first flowers you gave me.<br>
        May every anniversary ahead,<br>
        have flowers, and us.
      </div>
      <div class="footer">
        FIRST FLOWERS
      </div>
    </div>

  </div>

</body>
</html>
