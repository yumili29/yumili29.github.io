<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seasons with You</title>
  <style>
    /* 整体背景：柔和的奶油白到浅灰绿渐变 */
    body {
      font-family: 'Georgia', 'Times New Roman', serif; 
      background: linear-gradient(135deg, #fdfbf7 0%, #e8ede9 100%);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    /* 主容器：弹性盒子，左右分栏 */
    .container {
      display: flex;
      flex-direction: row; 
      align-items: center;
      justify-content: center;
      gap: 40px; 
      max-width: 900px;
      width: 100%;
      animation: fadeIn 1.5s ease-out;
    }

    /* 左侧照片区域：赋予画框质感 */
    .image-section {
      flex: 1; 
      max-width: 450px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
      transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .image-section:hover {
      transform: translateY(-8px); 
    }

    .image-section img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* 右侧文字区域：毛玻璃卡片 */
    .text-section {
      flex: 1;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.7); 
      backdrop-filter: blur(15px); 
      -webkit-backdrop-filter: blur(15px);
      padding: 50px 40px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
    }

    /* 英文小标题 */
    .subtitle {
      font-size: 11px;
      color: #8a9a8f;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 15px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    /* 主标题 */
    h1 {
      font-size: 30px;
      color: #2c3e50;
      font-weight: normal;
      letter-spacing: 2px;
      margin: 0 0 20px 0;
      line-height: 1.3;
    }

    /* 分割线 */
    .divider {
      width: 35px;
      height: 1px;
      background-color: #aebfb3;
      margin-bottom: 25px;
    }

    /* 正文排版：增加行高和斜体，更有诗意 */
    .content {
      font-size: 16px;
      color: #555;
      line-height: 2.4;
      letter-spacing: 1.2px;
      font-style: italic; 
    }

    /* 底部点缀 */
    .footer {
      margin-top: 35px;
      font-size: 11px;
      color: #9aa5a0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: 3px;
    }

    /* 手机端适配：变成上下排布，文字居中 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        gap: 20px;
      }
      .text-section {
        padding: 35px 25px;
        text-align: center;
      }
      .divider {
        margin: 0 auto 25px auto;
      }
    }

    /* 入场动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 左侧照片区：请确保仓库里有一张名为 1.jpg.jpg 的图片 -->
    <div class="image-section">
      <img src="1.jpg.jpg" alt="First Flowers">
    </div>

    <!-- 右侧文字区 -->
    <div class="text-section">
      <div class="subtitle">Our Story</div>
      <h1>Seasons with You</h1>
      <div class="divider"></div>
      <div class="content">
        Out of all the world,<br>
        you met me, and I met you.<br><br>
        These are the first flowers you gave me.<br>
        May every anniversary ahead,<br>
        have flowers, and us.
      </div>
      <div class="footer">
        FIRST FLOWERS
      </div>
    </div>

  </div>

</body>
</html>
