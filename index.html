<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seasons with You</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Serif SC', sans-serif;
      /* 把背景换成深邃的暗夜蓝，才能衬托出水晶玫瑰的发光感 */
      background-color: #0b0e14; 
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #e2e8f0;
      background-image: radial-gradient(circle at 50% 50%, #1a2332 0%, #0b0e14 80%);
    }

    .container {
      display: flex;
      flex-direction: row; 
      align-items: center;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
      gap: 50px;
      animation: fadeIn 1.5s ease-out;
    }

    /* 左侧：动态画布容器 */
    .canvas-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* 画布本身 */
    canvas {
      width: 100%;
      max-width: 450px;
      height: 450px;
      filter: drop-shadow(0 0 20px rgba(100, 200, 255, 0.4));
    }

    /* 右侧：文字区适配暗色调 */
    .text-section {
      flex: 1;
      padding: 40px;
      border-left: 1px solid #2d3748;
    }

    .subtitle {
      font-size: 11px;
      color: #718096;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 32px;
      color: #f8fafc;
      font-weight: 400;
      margin: 0 0 10px 0;
    }

    .names {
      font-size: 15px;
      color: #a0aec0;
      letter-spacing: 1px;
      margin-bottom: 40px;
    }

    .poem {
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.8;
      font-weight: 300;
      margin-bottom: 10px;
    }

    .poem-author {
      font-size: 11px;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    .content-eng {
      font-family: 'Noto Serif SC', serif;
      font-size: 15px;
      color: #e2e8f0;
      line-height: 2.2;
      padding-left: 20px;
      border-left: 2px solid #64ffda; /* 发光的青色线条 */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .text-section { border-left: none; border-top: 1px solid #2d3748; padding: 30px 10px; }
      canvas { height: 350px; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 左侧：动态水晶玫瑰 -->
    <div class="canvas-section">
      <canvas id="roseCanvas"></canvas>
    </div>

    <!-- 右侧：文字排版 -->
    <div class="text-section">
      <div class="subtitle">Chapter 01 · First Flowers</div>
      <h1>Seasons with You</h1>
      <div class="names">Yuning & Haoxuan</div>
      
      <div class="poem">
        "I carry your heart with me<br>
        (I carry it in my heart)<br>
        I am never without it."
      </div>
      <div class="poem-author">— E.E. Cummings</div>

      <div class="content-eng">
        Out of all the world,<br>
        you meet me, and I meet you.<br><br>
        May every anniversary ahead,<br>
        have flowers, and us.
      </div>
    </div>

  </div>

  <!-- 魔法：用代码画玫瑰 -->
  <script>
    const canvas = document.getElementById('roseCanvas');
    const ctx = canvas.getContext('2d');
    
    // 设置画布高清分辨率
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = 450 * dpr;
    canvas.height = 450 * dpr;
    ctx.scale(dpr, dpr);

    let time = 0;
    
    // 绘制玫瑰曲线的函数
    function drawRose() {
      ctx.clearRect(0, 0, 450, 450);
      ctx.save();
      ctx.translate(225, 225); // 将原点移到中心
      
      // 绘制发光层
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#64ffda'; // 青色荧光
      ctx.strokeStyle = `rgba(100, 200, 255, ${0.5 + 0.5 * Math.sin(time)})`; // 呼吸闪烁
      ctx.lineWidth = 2;
      
      ctx.beginPath();
      
      // 数学公式：绘制花瓣（r = a * cos(k * theta)）
      for (let theta = 0; theta < 2 * Math.PI * 4; theta += 0.05) {
        // 4代表4片花瓣，加上time让它旋转，加上sin让它有立体感
        let r = 140 * Math.sin(4 * theta + time) * Math.cos(0.5 * theta); 
        let x = r * Math.cos(theta);
        let y = r * Math.sin(theta);
        
        if (theta === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      
      ctx.closePath();
      ctx.stroke(); // 描边
      
      // 在内部画一些淡蓝色的填充线，增加水晶的层次感
      ctx.shadowBlur = 5;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
      
      time += 0.02; // 旋转速度
      requestAnimationFrame(drawRose);
    }

    drawRose();
  </script>
</body>
</html>
