<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wang Yuning & Zhang Haoxuan</title>
  <style>
    /* 使用优雅的衬线字体，营造高级感 */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap');

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f4f3ef; /* 呼应白玫瑰的米灰色背景 */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2c2c2c;
    }

    /* 整体画册质感的主容器 */
    .container {
      display: flex;
      flex-direction: row;
      max-width: 1000px;
      width: 90%;
      margin: 40px auto;
      background-color: #ffffff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06); /* 极淡的高级阴影 */
    }

    /* 左侧图片区域 */
    .image-section {
      flex: 1.2;
      position: relative;
      overflow: hidden;
    }

    .image-section img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 保证图片铺满不拉伸 */
      display: block;
    }

    /* 右侧文字区域 */
    .text-section {
      flex: 1;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #faf9f7; /* 极度柔和的奶白色 */
    }

    /* 顶部小字：致敬初见 */
    .subtitle {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #8a9a8f; /* 淡淡的灰绿色，呼应花束里的绿叶 */
      margin-bottom: 20px;
    }

    /* 名字区域：一眼认出你们 */
    .names {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: #1a1a1a;
      line-height: 1.3;
      margin: 0 0 30px 0;
      font-weight: 400;
    }

    .names span {
      display: block;
      font-size: 24px;
      color: #666;
      font-style: italic;
      margin-top: 5px;
    }

    /* 分割线 */
    .divider {
      width: 30px;
      height: 1px;
      background-color: #ccc;
      margin-bottom: 30px;
    }

    /* 正文文案 */
    .content {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 2;
      color: #444;
      font-style: italic;
      margin-bottom: 40px;
    }

    /* 底部落款日期 */
    .footer {
      font-size: 10px;
      letter-spacing: 2px;
      color: #999;
      text-transform: uppercase;
    }

    /* 手机端适配：自动变成上下排版 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        width: 95%;
        margin: 20px auto;
      }
      .image-section {
        height: 350px;
      }
      .text-section {
        padding: 40px 30px;
      }
      .names {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 左侧：白玫瑰照片 -->
    <div class="image-section">
      <img src="1.jpg" alt="White Roses">
    </div>

    <!-- 右侧：专属排版 -->
    <div class="text-section">
      
      <div class="subtitle">A Special Moment</div>
      
      <!-- 你们的名字 -->
      <div class="names">
        Wang Yuning
        <span>&</span>
        Zhang Haoxuan
      </div>
      
      <div class="divider"></div>
      
      <!-- 英文文案，取自卡片上的意思，简约克制 -->
      <div class="content">
        "The world is vast, <br>
        yet we found each other. <br>
        Through all four seasons, <br>
        may we always be together."
      </div>
      
      <div class="footer">Est. The First Flowers</div>

    </div>

  </div>

</body>
</html>
